
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom KW Super - WebRTC</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; }
        
        .header { width: 100%; padding: 15px; background: #1f1f1f; text-align: center; font-weight: bold; border-bottom: 1px solid #333; }
        
        /* Area Video */
        .video-container { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; 
            width: 100%; max-width: 800px; padding: 10px; flex-grow: 1; 
            align-items: center; justify-content: center;
        }
        
        video { 
            width: 100%; border-radius: 10px; background: #000; 
            border: 2px solid #333; object-fit: cover; aspect-ratio: 4/3;
        }

        /* Biar video kita sendiri (Local) ada di pojok kecil kalau di HP */
        @media (max-width: 600px) {
            .video-container { display: flex; position: relative; height: 100%; }
            #remoteVideo { width: 100%; height: 100%; }
            #localVideo { 
                position: absolute; bottom: 20px; right: 20px; 
                width: 100px; height: 140px; border: 2px solid white; z-index: 10;
                transform: scaleX(-1); /* Mirror */
            }
        }

        .controls { 
            padding: 20px; background: #1f1f1f; width: 100%; 
            display: flex; flex-direction: column; gap: 10px; align-items: center;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
        }

        .btn-group { display: flex; gap: 10px; width: 100%; max-width: 400px; }
        
        input { 
            padding: 12px; border-radius: 8px; border: none; width: 100%; 
            text-align: center; font-weight: bold; font-size: 1.1rem; letter-spacing: 2px;
        }
        
        button { 
            padding: 12px; border-radius: 8px; border: none; cursor: pointer; 
            font-weight: bold; color: white; flex: 1;
        }
        .btn-create { background: #3b82f6; }
        .btn-join { background: #10b981; }
        .btn-hangup { background: #ef4444; width: 100%; max-width: 400px; }

        #status { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="header">🎥 ZOOM KW (WebRTC)</div>

    <div class="video-container">
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div class="controls">
        <div id="status">Siapkan Kamera...</div>
        
        <div class="btn-group" id="menuAwal">
            <button class="btn-create" id="btnCreate">➕ Buat Room</button>
            <button class="btn-join" id="btnJoin">🔗 Join Room</button>
        </div>

        <div class="btn-group" id="menuJoin" style="display:none;">
            <input type="text" id="roomInput" placeholder="Masukan ID Room">
            <button class="btn-join" id="btnJoinConfirm">Masuk</button>
        </div>

        <div class="btn-group" id="menuInfo" style="display:none;">
            <input type="text" id="roomIdDisplay" readonly style="background: #333; color: #10b981;">
            <button class="btn-create" onclick="copyID()">📋 Copy ID</button>
        </div>

        <button class="btn-hangup" id="btnHangup" disabled>📞 Matikan</button>
    </div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // CONFIG FIREBASE (Pake punya SiGanteng gpp)
        const firebaseConfig = {
            apiKey: "AIzaSyBXWR-_aJyoMrUjTeNQYlcPD8p3eu58yOo",
            authDomain: "siganteng-absensi.firebaseapp.com",
            databaseURL: "https://siganteng-absensi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "siganteng-absensi",
            storageBucket: "siganteng-absensi.firebasestorage.app", 
            messagingSenderId: "917873420012",
            appId: "1:917873420012:web:0fe1a9eddc5f94959ba7c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- VARIABEL UTAMA ---
        const servers = {
            iceServers: [
                { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
            ]
        };

        let pc = new RTCPeerConnection(servers);
        let localStream = null;
        let remoteStream = null;
        let roomId = null;

        // ELEMENT HTML
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const status = document.getElementById('status');

        // 1. SIAPKAN KAMERA & MIC
        async function openUserMedia() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localStream = stream;
                localVideo.srcObject = stream;
                
                // Masukkan Video & Audio ke Jalur Koneksi
                stream.getTracks().forEach(track => {
                    pc.addTrack(track, stream);
                });

                // Siap Nerima Video Teman
                pc.ontrack = (event) => {
                    event.streams[0].getTracks().forEach(track => {
                        remoteStream.addTrack(track);
                    });
                };

                remoteStream = new MediaStream();
                remoteVideo.srcObject = remoteStream;
                status.innerText = "Kamera Siap. Silakan Buat atau Join Room.";
            } catch (err) {
                alert("Gagal akses kamera/mic: " + err);
            }
        }
        openUserMedia();

        // 2. BUAT ROOM (HOST)
        document.getElementById('btnCreate').onclick = async () => {
            document.getElementById('btnCreate').disabled = true;
            document.getElementById('btnJoin').disabled = true;
            
            // Bikin Referensi Room di Firebase
            const callDoc = doc(collection(db, "calls"));
            const offerCandidates = collection(callDoc, "offerCandidates");
            const answerCandidates = collection(callDoc, "answerCandidates");

            roomId = callDoc.id;
            
            // Simpan Calon Koneksi (ICE) ke Firebase
            pc.onicecandidate = (event) => {
                event.candidate && addDoc(offerCandidates, event.candidate.toJSON());
            };

            // Bikin Penawaran (Offer)
            const offerDescription = await pc.createOffer();
            await pc.setLocalDescription(offerDescription);

            const offer = {
                sdp: offerDescription.sdp,
                type: offerDescription.type,
            };

            await setDoc(callDoc, { offer });

            // Dengerin Jawaban (Answer) dari Tamu
            onSnapshot(callDoc, (snapshot) => {
                const data = snapshot.data();
                if (!pc.currentRemoteDescription && data?.answer) {
                    const answerDescription = new RTCSessionDescription(data.answer);
                    pc.setRemoteDescription(answerDescription);
                }
            });

            // Dengerin Calon Koneksi Tamu
            onSnapshot(answerCandidates, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const candidate = new RTCIceCandidate(change.doc.data());
                        pc.addIceCandidate(candidate);
                    }
                });
            });

            // UI Update
            document.getElementById('menuAwal').style.display = 'none';
            document.getElementById('menuInfo').style.display = 'flex';
            document.getElementById('roomIdDisplay').value = roomId;
            document.getElementById('btnHangup').disabled = false;
            status.innerText = "Menunggu lawan bicara...";
        };

        // 3. JOIN ROOM (TAMU)
        document.getElementById('btnJoin').onclick = () => {
            document.getElementById('menuAwal').style.display = 'none';
            document.getElementById('menuJoin').style.display = 'flex';
        };

        document.getElementById('btnJoinConfirm').onclick = async () => {
            roomId = document.getElementById('roomInput').value;
            if(!roomId) return alert("Masukkan ID Room dulu!");
            
            status.innerText = "Menghubungkan...";
            
            const callDoc = doc(db, "calls", roomId);
            const answerCandidates = collection(callDoc, "answerCandidates");
            const offerCandidates = collection(callDoc, "offerCandidates");

            pc.onicecandidate = (event) => {
                event.candidate && addDoc(answerCandidates, event.candidate.toJSON());
            };

            // Ambil Data Offer dari Host
            const callData = (await getDoc(callDoc)).data();
            if(!callData) return alert("ID Room tidak ditemukan!");

            const offerDescription = callData.offer;
            await pc.setRemoteDescription(new RTCSessionDescription(offerDescription));

            // Bikin Jawaban (Answer)
            const answerDescription = await pc.createAnswer();
            await pc.setLocalDescription(answerDescription);

            const answer = {
                type: answerDescription.type,
                sdp: answerDescription.sdp,
            };

            await updateDoc(callDoc, { answer });

            // Dengerin Calon Koneksi Host
            onSnapshot(offerCandidates, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const candidate = new RTCIceCandidate(change.doc.data());
                        pc.addIceCandidate(candidate);
                    }
                });
            });
            
            document.getElementById('menuJoin').style.display = 'none';
            document.getElementById('btnHangup').disabled = false;
        };

        // UTILS
        document.getElementById('btnHangup').onclick = () => {
            pc.close();
            location.reload();
        }
        window.copyID = () => {
            const copyText = document.getElementById("roomIdDisplay");
            copyText.select();
            document.execCommand("copy");
            alert("ID Room disalin: " + copyText.value);
        }
    </script>
</body>
</html>
