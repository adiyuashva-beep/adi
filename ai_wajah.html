<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pengenalan Wajah & Suara</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h2 { margin-bottom: 10px; color: #3b82f6; }
        
        .container { position: relative; width: 100%; max-width: 640px; }
        video { width: 100%; border-radius: 15px; border: 3px solid #334155; }
        canvas { position: absolute; top: 0; left: 0; }
        
        .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 640px; }
        input { padding: 10px; border-radius: 8px; border: none; flex: 1; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        
        .btn-blue { background: #3b82f6; color: white; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        
        button:active { transform: scale(0.95); }
        #status { margin-top: 10px; font-style: italic; color: #94a3b8; }
        
        .list-wajah { margin-top: 20px; text-align: left; width: 100%; max-width: 640px; }
        .tag { display: inline-block; background: #1e293b; padding: 5px 10px; border-radius: 20px; margin: 3px; border: 1px solid #3b82f6; font-size: 0.8em; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

    <h2>🤖 AI PENGENAL KELUARGA</h2>
    
    <div class="container">
        <video id="video" autoplay muted></video>
        <canvas id="overlay"></canvas>
    </div>

    <div id="status">Memuat Otak AI... (Tunggu sebentar)</div>

    <div class="controls">
        <input type="text" id="inputNama" placeholder="Masukkan Nama (Contoh: Istriku)">
        <button class="btn-blue" onclick="simpanWajah()">💾 Simpan Wajah</button>
    </div>
    
    <div class="controls">
        <button class="btn-green" onclick="mulaiDeteksi()">▶️ Mulai Deteksi & Bicara</button>
        <button class="btn-red" onclick="hapusData()">🗑️ Reset Data</button>
    </div>

    <div class="list-wajah">
        <small>Wajah Tersimpan:</small>
        <div id="daftarNama"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const status = document.getElementById('status');
        const inputNama = document.getElementById('inputNama');
        
        let labeledDescriptors = []; // Tempat simpan data wajah di RAM
        let faceMatcher; // Mesin pencocok
        let isDetecting = false;
        let lastSpoken = ""; // Biar ga ngomong berulang-ulang
        
        // URL Model AI (Otaknya) - Kita pinjam dari Github orang biar ga perlu download
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

        // 1. LOAD MODEL
        Promise.all([
            faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]).then(startVideo).catch(err => {
            status.innerText = "Gagal memuat AI. Cek koneksi internet!";
            console.error(err);
        });

        // 2. NYALAKAN KAMERA
        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(stream => {
                    video.srcObject = stream;
                    status.innerText = "AI Siap! Masukkan nama & simpan wajah dulu.";
                    loadDariStorage(); // Cek ada data lama gak
                })
                .catch(err => console.error("Kamera error:", err));
        }

        // 3. SIMPAN WAJAH (REGISTRASI)
        async function simpanWajah() {
            const nama = inputNama.value.trim();
            if (!nama) return alert("Isi nama dulu, Bro!");
            
            status.innerText = "Menganalisa wajah...";
            
            // Deteksi wajah tunggal
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            
            if (detection) {
                // Simpan Deskripsi Wajah (Angka Matematika)
                const newDescriptor = new faceapi.LabeledFaceDescriptors(nama, [detection.descriptor]);
                labeledDescriptors.push(newDescriptor);
                
                // Simpan ke LocalStorage biar di-refresh ga ilang
                simpanKeStorage();
                
                status.innerText = `Berhasil! Wajah ${nama} tersimpan.`;
                inputNama.value = "";
                renderList();
                alert(`Wajah ${nama} berhasil direkam!`);
            } else {
                alert("Wajah tidak terdeteksi! Pastikan cahaya terang & wajah menghadap kamera.");
                status.innerText = "Gagal deteksi.";
            }
        }

        // 4. MULAI DETEKSI (UJIAN)
        async function mulaiDeteksi() {
            if (labeledDescriptors.length === 0) return alert("Belum ada data wajah! Simpan dulu.");
            if (isDetecting) return;
            
            isDetecting = true;
            status.innerText = "Mode: MENCARI WAJAH...";
            
            // Buat pencocok
            faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6); // 0.6 = Toleransi kemiripan
            
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                // Deteksi SEMUA wajah di kamera
                const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                
                // Bersihkan kanvas
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                
                // Cek tiap wajah
                const results = resizedDetections.map(d => faceMatcher.findBestMatch(d.descriptor));
                
                results.forEach((result, i) => {
                    const box = resizedDetections[i].detection.box;
                    const { label, distance } = result;
                    
                    // Gambar Kotak
                    const text = label === 'unknown' ? "Tidak Dikenal" : `${label} (${Math.round((1-distance)*100)}%)`;
                    const drawBox = new faceapi.draw.DrawBox(box, { label: text });
                    drawBox.draw(canvas);

                    // LOGIKA BICARA (TTS)
                    if (label !== 'unknown') {
                        bicara(label);
                    }
                });
            }, 1000); // Cek setiap 1 detik biar ga berat
        }

        // 5. FITUR NGOMONG (TEXT TO SPEECH)
        function bicara(nama) {
            // Cegah ngomong berulang-ulang untuk orang yang sama
            if (lastSpoken === nama) return;
            
            lastSpoken = nama; // Kunci biar ga spam
            
            const kalimat = `Halo, ${nama}. Selamat datang Ndan!`;
            const ucapan = new SpeechSynthesisUtterance(kalimat);
            ucapan.lang = 'id-ID'; // Bahasa Indonesia
            ucapan.rate = 1; // Kecepatan bicara
            
            window.speechSynthesis.speak(ucapan);
            
            // Reset kunci setelah 5 detik (biar bisa disapa lagi nanti)
            setTimeout(() => { lastSpoken = ""; }, 8000); 
        }

        // --- MANAJEMEN DATA ---
        
        function simpanKeStorage() {
            // Kita harus ubah Float32Array jadi Array biasa biar bisa disimpan JSON
            const dataSimpan = labeledDescriptors.map(ld => ({
                label: ld.label,
                descriptors: ld.descriptors.map(d => Array.from(d))
            }));
            localStorage.setItem('db_wajah', JSON.stringify(dataSimpan));
        }

        function loadDariStorage() {
            const data = localStorage.getItem('db_wajah');
            if (data) {
                const parsed = JSON.parse(data);
                labeledDescriptors = parsed.map(d => new faceapi.LabeledFaceDescriptors(
                    d.label,
                    d.descriptors.map(arr => new Float32Array(arr))
                ));
                renderList();
                status.innerText = `Memuat ${labeledDescriptors.length} wajah dari memori.`;
            }
        }

        function renderList() {
            const container = document.getElementById('daftarNama');
            container.innerHTML = labeledDescriptors.map(d => `<span class="tag">${d.label}</span>`).join('');
        }

        function hapusData() {
            if(confirm("Yakin hapus semua data wajah?")) {
                localStorage.removeItem('db_wajah');
                location.reload();
            }
        }
    </script>
</body>
</html>
