<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Jarvis - Mode Teliti</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h2 { margin-bottom: 10px; color: #3b82f6; text-align: center;}
        
        .container { position: relative; width: 100%; max-width: 640px; }
        video { width: 100%; border-radius: 15px; border: 3px solid #334155; transform: scaleX(-1); } 
        video.back-cam { transform: scaleX(1); }
        
        canvas { position: absolute; top: 0; left: 0; }
        
        .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 640px; }
        input { padding: 12px; border-radius: 8px; border: none; flex: 1; min-width: 200px; }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 5px;}
        
        .btn-blue { background: #3b82f6; color: white; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-yellow { background: #f59e0b; color: white; }
        
        button:active { transform: scale(0.95); }
        #status { margin-top: 10px; font-style: italic; color: #94a3b8; text-align: center; }
        
        .list-wajah { margin-top: 20px; text-align: left; width: 100%; max-width: 640px; background: #1e293b; padding: 15px; border-radius: 10px;}
        .tag { display: inline-block; background: #0f172a; padding: 5px 10px; border-radius: 20px; margin: 3px; border: 1px solid #3b82f6; font-size: 0.8em; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

    <h2>🤖 AI JARVIS (MODE TELITI)</h2>
    
    <div class="container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
    </div>

    <div id="status">Memuat Otak AI...</div>

    <div class="controls">
        <button class="btn-yellow" onclick="gantiKamera()">🔄 Ganti Kamera</button>
    </div>

    <div class="controls">
        <input type="text" id="inputNama" placeholder="Nama (Contoh: Bapak)">
        <button class="btn-blue" onclick="simpanWajah()">💾 Rekam Wajah</button>
    </div>
    
    <div class="controls">
        <button class="btn-green" onclick="mulaiDeteksi()">▶️ MULAI SCAN</button>
        <button class="btn-red" onclick="hapusData()">🗑️ Reset Data</button>
    </div>

    <div class="list-wajah">
        <small style="color:#aaa">Data Tersimpan:</small>
        <div id="daftarNama"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const status = document.getElementById('status');
        const inputNama = document.getElementById('inputNama');
        
        let labeledDescriptors = []; 
        let faceMatcher; 
        let isDetecting = false;
        let lastSpoken = ""; 
        let currentStream = null;
        let facingMode = 'user'; 

        // URL Model AI
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

        // 1. LOAD MODEL
        Promise.all([
            faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]).then(startVideo).catch(err => {
            status.innerText = "Gagal memuat AI. Cek koneksi internet!";
        });

        // 2. KAMERA
        function startVideo() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());

            if (facingMode === 'user') video.classList.remove('back-cam'); 
            else video.classList.add('back-cam'); 

            navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } })
                .then(stream => {
                    currentStream = stream;
                    video.srcObject = stream;
                    status.innerText = "Kamera Siap! Hapus Data Dulu jika Salah.";
                    loadDariStorage(); 
                })
                .catch(err => {
                    status.innerText = "Gagal akses kamera.";
                });
        }

        function gantiKamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startVideo();
        }

        // 3. SIMPAN WAJAH
        async function simpanWajah() {
            const nama = inputNama.value.trim();
            if (!nama) return alert("Isi nama dulu!");
            
            status.innerText = "Menganalisa wajah...";
            
            // Menggunakan deteksi yang lebih detail
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            
            if (detection) {
                const newDescriptor = new faceapi.LabeledFaceDescriptors(nama, [detection.descriptor]);
                labeledDescriptors.push(newDescriptor);
                simpanKeStorage();
                
                status.innerText = `Sukses! Wajah ${nama} tersimpan.`;
                inputNama.value = "";
                renderList();
                bicara(`Oke, ${nama} sudah direkam.`);
            } else {
                alert("Wajah tidak jelas! Pastikan cahaya terang.");
                status.innerText = "Gagal deteksi.";
            }
        }

        // 4. MULAI DETEKSI (SENSITIVITAS DIPERBAIKI DISINI)
        async function mulaiDeteksi() {
            if (labeledDescriptors.length === 0) return alert("Rekam wajah dulu!");
            if (isDetecting) return;
            
            isDetecting = true;
            status.innerText = "MENCARI TARGET...";
            
            // --- BAGIAN PENTING: ANGKA 0.45 ARTINYA HARUS MIRIP BANGET ---
            // Semakin kecil angkanya (0.1 - 0.4), semakin ketat/galak.
            // Semakin besar (0.6 - 0.8), semakin longgar/asal mirip.
            faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45); 
            
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                
                const results = resizedDetections.map(d => faceMatcher.findBestMatch(d.descriptor));
                
                results.forEach((result, i) => {
                    const box = resizedDetections[i].detection.box;
                    const { label, distance } = result;
                    
                    // Logic: Kalau 'unknown', jangan tampilkan nama
                    let text = "Asing";
                    let color = "#ef4444"; // Merah

                    if (label !== "unknown") {
                        const akurasi = Math.round((1 - distance) * 100);
                        text = `${label} (${akurasi}%)`;
                        color = "#10b981"; // Hijau
                        bicara(`Halo, ${label}.`);
                    }

                    const drawBox = new faceapi.draw.DrawBox(box, { label: text, boxColor: color });
                    drawBox.draw(canvas);
                });
            }, 1000); 
        }

        function bicara(teks) {
            if (lastSpoken === teks) return;
            lastSpoken = teks; 
            const ucapan = new SpeechSynthesisUtterance(teks);
            ucapan.lang = 'id-ID'; 
            window.speechSynthesis.speak(ucapan);
            setTimeout(() => { lastSpoken = ""; }, 4000); 
        }

        function simpanKeStorage() {
            const dataSimpan = labeledDescriptors.map(ld => ({
                label: ld.label,
                descriptors: ld.descriptors.map(d => Array.from(d))
            }));
            localStorage.setItem('db_wajah_v2', JSON.stringify(dataSimpan));
        }

        function loadDariStorage() {
            const data = localStorage.getItem('db_wajah_v2');
            if (data) {
                const parsed = JSON.parse(data);
                labeledDescriptors = parsed.map(d => new faceapi.LabeledFaceDescriptors(
                    d.label,
                    d.descriptors.map(arr => new Float32Array(arr))
                ));
                renderList();
            }
        }

        function renderList() {
            document.getElementById('daftarNama').innerHTML = labeledDescriptors.map(d => `<span class="tag">${d.label}</span>`).join('');
        }

        function hapusData() {
            if(confirm("Yakin hapus semua data?")) {
                localStorage.removeItem('db_wajah_v2');
                location.reload();
            }
        }
    </script>
</body>
</html>
