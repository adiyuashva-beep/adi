<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGanteng Meeting</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;}
        
        .card {
            background: #1e293b; padding: 30px; border-radius: 20px;
            width: 85%; max-width: 400px;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.2); border: 1px solid #334155;
        }
        
        h2 { margin-top: 0; color: #3b82f6; }
        p { color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }

        input {
            width: 100%; padding: 15px; margin: 8px 0; border-radius: 10px;
            border: 2px solid #334155; background: #0f172a; color: white;
            font-size: 1rem; box-sizing: border-box; text-align: center;
        }
        input:focus { border-color: #3b82f6; outline: none; }
        
        button {
            width: 100%; padding: 15px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer;
            margin-top: 15px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        button:active { transform: scale(0.97); }

        .note { font-size: 0.8rem; color: #64748b; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎥 NGOBROL</h2>
        <p>Masuk ke ruang rapat video konferensi GOPLE.<br>Stabil & Ringan.</p>
        
        <input type="text" id="inputRoom" placeholder="Nama Ruang (Misal: Guru)" value="RapatUmum">
        
        <button onclick="bukaRapat()">🚀 BUKA RUANG RAPAT</button>
        
        <div class="note">
            *Akan membuka tab baru / aplikasi Jitsi.<br>
            *Jika diminta instal aplikasi, pilih "Launch in Web" saja.
        </div>
    </div>

    <script>
        function bukaRapat() {
            let room = document.getElementById('inputRoom').value.trim();
            if(!room) return alert("Isi nama ruangan dulu Ndan!");

            // Kita bikin nama room unik biar ga tabrakan sama orang sedunia
            // Spasi diganti jadi _
            const roomID = "GOPLE_OFFICIAL_" + room.replace(/\s/g, '_');

            // --- RAHASIA ANTI MUTER ---
            // Alihkan langsung ke website asli Jitsi
            const url = `https://meet.jit.si/${roomID}`;
            
            // Buka di tab baru (ini teknik paling aman buat HP)
            window.location.href = url;
        }
    </script>
</body>
</html>
